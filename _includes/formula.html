  <p class="formula-html"><var>F</var><sub>N</sub> = 9.80665 × <var>C</var>(<var>u</var>)</p>
  <p class="formula-note"><var>C</var>(<var>u</var>) 为推进器曲线输出，记录单位是千克力（kgf）；<var>F</var><sub>N</sub> 为换算后的牛顿（N）。系数 9.80665 来自标准单位换算 1&nbsp;kgf = 9.80665&nbsp;N（对应标准重力加速度 9.80665&nbsp;m/s²），<strong>不是本项目拟合得到的系数</strong>。当前也没有完整的 <var>C</var>(<var>u</var>) 曲线表达式，只有下面这一条历史记录点。</p>
