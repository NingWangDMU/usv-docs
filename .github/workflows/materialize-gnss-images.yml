name: Materialize GNSS evidence images

on:
  push:
    branches: ["docs/gnss-verification-20261125"]
    paths:
      - "assets/images/gnss-20261125/*.b64"
      - ".github/workflows/materialize-gnss-images.yml"

permissions:
  contents: write

concurrency:
  group: materialize-gnss-images
  cancel-in-progress: false

jobs:
  materialize:
    if: github.ref == 'refs/heads/docs/gnss-verification-20261125'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: docs/gnss-verification-20261125

      - name: Decode original screenshots and remove temporary files
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import base64, hashlib
          expected = {
            "01-gnss-sensor-inspector.png": "1b57997732442cfb58add2d325a98c228bfbf03859254143dcabc21b52b14352",
            "02-gnss-grpc-inspector.png": "9a15bd8b13c20fb7e861116e85fd8e1557193dd6c425fb1607a39836ff92c5e8",
            "03-tf-streamer-grpc-inspector.png": "be38a6b0492d6e592921c221ad31708d8ed5669948d578cb34bafb21a24ead3d",
            "04-rosconnection-inspector.png": "61e659150212f08abdb474dcfa8dc17b529a6e0116c4fc8951c2d07e616878a3",
            "05-editor-console-scene.png": "088a1ff321b5308430291bac13f3dd2c461abc1f788221459aa4c11879b44b7b",
          }
          root = Path("assets/images/gnss-20261125")
          for name, digest in expected.items():
              src = root / f"{name}.b64"
              if not src.exists():
                  raise SystemExit(f"missing {src}")
              data = base64.b64decode("".join(src.read_text().split()))
              got = hashlib.sha256(data).hexdigest()
              if got != digest:
                  raise SystemExit(f"hash mismatch {name}: {got} != {digest}")
              (root / name).write_bytes(data)
              src.unlink()
              print(f"wrote {name} sha256={got}")
          PY
          rm -f .github/workflows/materialize-gnss-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          docs: 写入 GNSS 证据截图原件

          从临时 base64 还原真实 Inspector / 编辑器截图，并移除临时编码文件与一次性工作流。
          EOF
          )"
          git push
