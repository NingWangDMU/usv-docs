name: Build and Deploy Jekyll site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install test dependencies
        run: npm ci
          
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/usv-docs"
        env:
          JEKYLL_ENV: production
          
      - name: Run search tests
        run: npm test
          
      - name: Verify build paths
        run: |
          echo "Verifying asset paths contain /usv-docs/ prefix..."
          
          # Check index.html
          if ! grep -q '"/usv-docs/' _site/index.html; then
            echo "ERROR: index.html missing /usv-docs/ paths"
            exit 1
          fi
          
          # Check search data
          if [ -f "_site/assets/js/search-data.json" ]; then
            if ! grep -q '/usv-docs/' _site/assets/js/search-data.json; then
              echo "ERROR: search-data.json missing /usv-docs/ paths"
              exit 1
            fi
          fi
          
          # Verify no test files leaked
          if [ -n "$(find _site -name 'test-*.js' -o -name 'SECURITY-*.md' -o -name 'FIXES-*.md')" ]; then
            echo "ERROR: Test files found in _site"
            exit 1
          fi
          
          echo "✓ Path verification passed"
          
      - name: Verify internal links
        run: |
          echo "Checking internal links format..."
          
          # Check for hardcoded relative links that should use baseurl
          if grep -r '\](issues)' _site/*.html 2>/dev/null; then
            echo "ERROR: Found hardcoded relative link without baseurl"
            exit 1
          fi
          
          echo "✓ Internal links verified"
          
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
